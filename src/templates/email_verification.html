<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            width: 90%;
            max-width: 480px;
            padding: 48px 40px;

            background: white;
            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 36px;
        }

        .success {
            background: #dcfce7;
            color: #16a34a;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
            font-weight: 700;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #6b7280;
            font-size: 16px;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="card">

        {% if success %}

            <div class="icon success">
                ✓
            </div>

        {% else %}

            <div class="icon error">
                !
            </div>

        {% endif %}

        <h1>{{ title }}</h1>

        <p>
            {{ message }}
        </p>

        <div class="footer">
            You can safely close this window.
        </div>

    </div>

</body>
</html>
